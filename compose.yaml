services:
  llm-retry-proxy:
    build:
      context: .
      args:
        DOCKER_REGISTRY: "${DOCKER_REGISTRY:-docker.io}"
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-library/python:3.12-slim}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    container_name: llm-retry-proxy
    command: ["python", "/app/main.py"]
    # 旧内核(如3.10)没有 clone3 系统调用，
    # 而 docker 19 的默认 seccomp profile 对未知 syscall 返回 EPERM，
    # 导致镜像内 glibc 创建线程时报 can't start new thread。解除 seccomp 规避。
    # 新内核 + 新 docker 环境下 clone3 本就在白名单内，此选项无副作用。
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_HOST: 0.0.0.0
      KEY_POOL_FILE: "${KEY_POOL_FILE-/app/key_pool.csv}"
      LOG_DIR: /app/logs
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${LISTEN_PORT:-8080}:${LISTEN_PORT:-8080}"
    volumes:
      - ./key_pool.csv:/app/key_pool.csv:ro
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('LISTEN_PORT','8080')+'/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
